[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spacers-agent"
version = "0.1.0"
description = "Local orchestration foundations for remote-sensing multi-Agent evaluation."
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "PyYAML>=6.0",
  "Pillow>=10.0.0",
  "numpy>=1.26",
  "opencv-python>=4.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23",
  "numpy>=1.26",
]
yolo = ["ultralytics==8.4.102"]
yolo-onnx = ["onnxruntime-gpu>=1.23", "numpy>=1.26", "opencv-python>=4.8"]
qwen35-gb10 = ["huggingface-hub>=1.0.0", "kernels>=0.15.2,<0.16.0"]

[tool.setuptools.packages.find]
include = ["spacers_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "live_qwen: requires an explicitly authorized live Qwen service",
  "live_deepseek: requires an explicitly authorized live DeepSeek API",
  "live_dataset: requires an explicitly authorized local server dataset",
]
