name: Full offline tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPU PyTorch
        run: |
          python -m pip install \
            torch \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install project and full-test dependencies
        run: |
          python -m pip install -e ".[dev,change,change-head]"
          python -m pip install \
            "safetensors>=0.4" \
            "peft==0.20.0" \
            "transformers==5.14.1"

      - name: Show test environment
        run: |
          python --version
          python - <<'PY'
          import torch

          print("torch", torch.__version__)
          print("cuda_available", torch.cuda.is_available())
          PY
          python -m pip show torch
          python -m pip show safetensors
          python -m pip show peft
          python -m pip show transformers

      - name: Collect full suite
        run: python -m pytest -q --collect-only

      - name: Run full offline suite
        run: python -m pytest -q
