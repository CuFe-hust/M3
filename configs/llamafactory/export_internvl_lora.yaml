# LLaMA-Factory export config: merge base model + LoRA adapter into a full model.
# 将基座模型与 LoRA 适配器合并导出为完整模型的 LLaMA-Factory 配置。
#
# Launch via scripts/export_internvl_lora.sh, which injects
# model_name_or_path / adapter_name_or_path / export_dir at runtime.
# 通过 scripts/export_internvl_lora.sh 启动，三个路径在运行时注入。

# Model and adapter. 基座模型与 LoRA 适配器。
model_name_or_path: null        # filled by the launcher script; 由启动脚本注入
adapter_name_or_path: null      # filled by the launcher script; 由启动脚本注入
template: qwen3                 # must match the training config; 须与训练配置一致
trust_remote_code: true         # InternVL3.5 ships its own modeling code; 需加载模型目录自带代码

# Export settings. 导出设置。
finetuning_type: lora
export_dir: null                # filled by the launcher script; 由启动脚本注入
export_size: 5                  # shard size in GB per safetensors file; 每个分片约 5GB
export_device: cpu              # merge on CPU to avoid extra VRAM; 在 CPU 上合并，节省显存
export_legacy_format: false     # save .safetensors instead of legacy .bin; 保存 safetensors 格式
