# Local Qwen model configuration: Qwen3-VL-8B with merged merger-LoRA.
# 本地 Qwen 模型配置：已合并 merger-LoRA 的 Qwen3-VL-8B。
models:
  qwen:
    model: models/qwen3_vl_8b/merged
    cache_model_id: qwen3-vl-8b-merger-lora-merged
    allow_download: false

# Concrete expert deployment inventory belongs here, not in Python settings.
backend:
  yolo:
    enabled: true
    detectors:
      - name: detector_obb_csl_001
        enabled: true
        weights: models/yolo_obb/yolov5m_obb_csl_dotav20.onnx
        runtime: onnx_yolov5_obb
        task: obb
        model_id: YOLOv5-OBB-CSL:DOTA-v2.0:yolov5m
        sha256: c964985b56ab05bcb679718f3fe5261246fd41f8cf0e4e620ba5b1c68092a81a
        source_dataset: DOTAv2.0
        priority: 100
        classes: [plane, baseball diamond, bridge, ground track field, small vehicle, large vehicle, ship, tennis court, basketball court, storage tank, soccer ball field, roundabout, harbor, swimming pool, helicopter, container crane, airport, helipad]
        aliases: {}
        confidence: 0.20
        iou: 0.50
        image_size: 1024
        device: "0"
        max_detections: 1000
        require_cuda: true
        allow_cpu_fallback: false
        boundary_duplicate_iou: 0.50
        boundary_duplicate_center_px: 16.0
      - name: detector_yolo_detect_001
        enabled: true
        weights: models/isaid-yolo11s-tiles1024-o20/isaid_yolo11s_tiles1024_o20_best_epoch111.pt
        runtime: ultralytics
        task: detect
        model_id: YOLO11s:iSAID:tiles1024-o20:epoch111
        sha256: f3d741a8f1c6c78d2e3cf2c92392fd2547ef537c25ab4f8da093c2d938369266
        source_dataset: iSAID
        priority: 200
        classes: [baseball_diamond, basketball_court, bridge, ground_track_field, harbor, helicopter, large_vehicle, plane, roundabout, ship, small_vehicle, soccer_ball_field, storage_tank, swimming_pool, tennis_court]
        aliases: {baseball diamond: baseball_diamond, basketball court: basketball_court, ground track field: ground_track_field, large vehicle: large_vehicle, small vehicle: small_vehicle, soccer ball field: soccer_ball_field, storage tank: storage_tank, swimming pool: swimming_pool, tennis court: tennis_court}
        confidence: 0.20
        iou: 0.50
        image_size: 1024
        device: "0"
        max_detections: 2000
        require_cuda: true
        allow_cpu_fallback: false
        boundary_duplicate_iou: 0.50
        boundary_duplicate_center_px: 16.0
