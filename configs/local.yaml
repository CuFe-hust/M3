# Visual Planner and Grounding Agent evaluation path.
# 本地 Qwen3.5-9B 基座；Visual Planner 与 Grounding Agent 使用各自最终 LoRA。
models:
  qwen:
    model: /home/lijia/M3/models/Qwen3.5-9B
    cache_model_id: Qwen/Qwen3.5-9B:local
    allow_download: false
  qwen_adapters:
    visual-planner-final:
      path: /home/lijia/M3/outputs/finetune/qwen35-9b-visual-planner-final-v1-lr5e-5/final_adapter
      logical_id: qwen35-9b-visual-planner-final-v1
      revision: f6c5ab9d71a68f64893fc26fcb524702511abf5cda713bf691a9cf23ffeef1b0
      enabled: true
    grounding-agent-final:
      path: /home/lijia/M3/outputs/grounding_sft_v4_lora_20260829/final_adapter
      logical_id: qwen35-9b-grounding-agent-sft-v4-20260829
      revision: 591e32f2d68db305dbe5580494871bec4b8fc82548b169538e32638d2c7ef3af
      enabled: true
  qwen_adapter_bindings:
    planner: visual-planner-final
    counting: base
    change: base
    grounding: grounding-agent-final
    general_vqa: base
    caption: base

reporting:
  native_html: true
  max_visual_samples: null

# Concrete expert deployment inventory belongs here, not in Python settings.
backend:
  yolo:
    # GB10 production invariant:
    # YOLO inference is CPU-only.
    # The YOLOv5-OBB ONNX CUDA Execution Provider is not used on GB10
    # because it is not sufficiently stable for production runs.
    # Both ONNX and Ultralytics YOLO experts therefore use device=cpu.
    # This does not change the Qwen or SegFormer device policy.
    enabled: true
    detectors:
      - name: detector_obb_csl_001
        enabled: true
        weights: models/yolo_obb/yolov5m_obb_csl_dotav20.onnx
        runtime: onnx_yolov5_obb
        task: obb
        model_id: YOLOv5-OBB-CSL:DOTA-v2.0:yolov5m
        sha256: c964985b56ab05bcb679718f3fe5261246fd41f8cf0e4e620ba5b1c68092a81a
        source_dataset: DOTAv2.0
        priority: 100
        classes: [plane, baseball diamond, bridge, ground track field, small vehicle, large vehicle, ship, tennis court, basketball court, storage tank, soccer ball field, roundabout, harbor, swimming pool, helicopter, container crane, airport, helipad]
        aliases: {}
        confidence: 0.20
        iou: 0.50
        image_size: 1024
        # GB10 production invariant: explicit CPU-only ONNX YOLO.
        device: cpu
        max_detections: 1000
        require_cuda: false
        allow_cpu_fallback: false
        boundary_duplicate_iou: 0.50
        boundary_duplicate_center_px: 16.0
      - name: detector_yolo_detect_001
        enabled: true
        weights: models/isaid-yolo11s-tiles1024-o20/isaid_yolo11s_tiles1024_o20_best_epoch111.pt
        runtime: ultralytics
        task: detect
        model_id: YOLO11s:iSAID:tiles1024-o20:epoch111
        sha256: f3d741a8f1c6c78d2e3cf2c92392fd2547ef537c25ab4f8da093c2d938369266
        source_dataset: iSAID
        priority: 200
        classes: [baseball_diamond, basketball_court, bridge, ground_track_field, harbor, helicopter, large_vehicle, plane, roundabout, ship, small_vehicle, soccer_ball_field, storage_tank, swimming_pool, tennis_court]
        aliases: {baseball diamond: baseball_diamond, basketball court: basketball_court, ground track field: ground_track_field, large vehicle: large_vehicle, small vehicle: small_vehicle, soccer ball field: soccer_ball_field, storage tank: storage_tank, swimming pool: swimming_pool, tennis court: tennis_court}
        confidence: 0.20
        iou: 0.50
        image_size: 1024
        # GB10 production invariant: explicit CPU-only Ultralytics YOLO.
        device: cpu
        max_detections: 2000
        require_cuda: false
        allow_cpu_fallback: false
        boundary_duplicate_iou: 0.50
        boundary_duplicate_center_px: 16.0

# VQA visual evidence calibration: bindings are stable logical identities;
# the composition root maps them to verified clients, never to raw paths.
# VQA 视觉证据校准：binding 是稳定逻辑身份；组合根把它们映射到已验证客户端，
# 绝不映射到裸路径。
visual_planning:
  detectors:
    detector_obb_csl_001:
      confidence_threshold: 0.20
      nms_iou_threshold: 0.50
      max_detections: 1000
  segmenters:
    segmenter_mitb2_001:
      enabled: true
      class_map_version: verified-2026-08-06
    segmenter_oem_001:
      enabled: true
      class_map_version: verified-2026-08-20
  preprocessing:
    version: greedy-1024-stretch-v1
    tile_size: 1024
    partition_policy: greedy-row-major-no-overlap
    remainder_resize: stretch
    rgb_interpolation: lanczos
    mask_inverse_interpolation: nearest
    max_tile_concurrency: 4

counting:
  sequential: true
  concurrency: 1
  fallback_on_backend_unavailable: true
  fallback_on_backend_error: true
  verify_empty_detection: true
  verify_empty_semantic: false
  trust_empty_detection: false
  multi_detector_enabled: true
  max_selected_detector_experts: 2
  min_successful_detector_experts: 1
  ensemble_iou_threshold: 0.45
  ensemble_center_distance_ratio: 0.60
  ensemble_singleton_high_confidence: 0.65
  max_disagreement_regions: 12
  disagreement_context_padding_ratio: 0.35
  unresolved_ensemble_policy: retain_high_confidence

agents:
  change:
    registration:
      enabled: true
      quality_policy: fallback_raw
    harmonization:
      enabled: true
      reject_when_pif_mad_worse: true
    semantic:
      enabled: true
      feature_stages: [1, 2, 3]
      multi_expert_enabled: true
      max_experts: 2
      min_successful_experts: 1
      semantic_consensus_weight: 0.65
      semantic_union_weight: 0.35
      failure_policy: fallback_legacy
      temporal_stability_enabled: false
    building_rescue:
      enabled: true
      shadow_only: false
      qwen_review_enabled: true
      allowed_directions: [added]
      edge_only: true
    reliability:
      enabled: true
    learned_change:
      enabled: false
      mode: shadow
      checkpoint_dir: null
      fusion_weight: 0.0
      failure_policy: fallback_rule
      strict_contract: true
      device: auto
    training_capture:
      enabled: false
      save_dense_features: false
      capture_learned_inputs_only: true
