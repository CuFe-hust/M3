# Local Qwen3.5-9B base with one verified supplement LoRA shared by all
# planner/Agent bindings. 本地 Qwen3.5-9B 基座；所有 planner/Agent 绑定共享
# 一个已验证 supplement LoRA。
models:
  qwen:
    model: models/Qwen3.5-9B
    cache_model_id: Qwen/Qwen3.5-9B:local
    allow_download: false
  qwen_adapters:
    visual-planner-supplement:
      path: outputs/finetune/qwen35-9b-visual-planner-lora-supplement-20260824/final_adapter
      logical_id: qwen35-9b-visual-planner-supplement-20260824
      revision: e59d7f5afe0f3c75a06e785579a74d4a7a9880a589be8d91197d699569dea170
      enabled: true
  qwen_adapter_bindings:
    planner: visual-planner-supplement
    counting: visual-planner-supplement
    change: visual-planner-supplement
    grounding: visual-planner-supplement
    general_vqa: visual-planner-supplement
    caption: visual-planner-supplement

reporting:
  native_html: true
  max_visual_samples: null

# Concrete expert deployment inventory belongs here, not in Python settings.
backend:
  yolo:
    # GB10 production invariant:
    # YOLO inference is CPU-only.
    # The YOLOv5-OBB ONNX CUDA Execution Provider is not used on GB10
    # because it is not sufficiently stable for production runs.
    # Both ONNX and Ultralytics YOLO experts therefore use device=cpu.
    # This does not change the Qwen or SegFormer device policy.
    enabled: true
    detectors:
      - name: detector_obb_csl_001
        enabled: true
        weights: models/yolo_obb/yolov5m_obb_csl_dotav20.onnx
        runtime: onnx_yolov5_obb
        task: obb
        model_id: YOLOv5-OBB-CSL:DOTA-v2.0:yolov5m
        sha256: c964985b56ab05bcb679718f3fe5261246fd41f8cf0e4e620ba5b1c68092a81a
        source_dataset: DOTAv2.0
        priority: 100
        classes: [plane, baseball diamond, bridge, ground track field, small vehicle, large vehicle, ship, tennis court, basketball court, storage tank, soccer ball field, roundabout, harbor, swimming pool, helicopter, container crane, airport, helipad]
        aliases: {}
        confidence: 0.20
        iou: 0.50
        image_size: 1024
        # VQA evidence runs this detector in an isolated, restartable CUDA worker.
        # VQA evidence 在隔离且可重启的 CUDA worker 中运行该检测器。
        device: "0"
        max_detections: 1000
        require_cuda: true
        allow_cpu_fallback: false
        gpu_mem_limit_gib: 8
        boundary_duplicate_iou: 0.50
        boundary_duplicate_center_px: 16.0
      - name: detector_obb_ultralytics_001
        enabled: true
        weights: models/vrsbench-yolo11m-obb-1024/vrsbench_yolo11m_obb_best.pt
        runtime: ultralytics
        task: obb
        model_id: YOLO11m-OBB:VRSBench-QA1024:best
        sha256: 4a86331ed43b316e60050c5a890f3149f48bf34ce6f5c0e61a15382969feaf52
        source_dataset: VRSBench-QA1024
        priority: 200
        classes: [plane, ship, storage-tank, baseball-diamond, tennis-court, basketball-court, ground-track-field, harbor, bridge, large-vehicle, small-vehicle, helicopter, roundabout, soccer-ball-field, swimming-pool, container-crane, airport, helipad]
        aliases: {storage tank: storage-tank, baseball diamond: baseball-diamond, tennis court: tennis-court, basketball court: basketball-court, ground track field: ground-track-field, large vehicle: large-vehicle, small vehicle: small-vehicle, soccer ball field: soccer-ball-field, swimming pool: swimming-pool, container crane: container-crane}
        confidence: 0.20
        iou: 0.50
        image_size: 1024
        # GB10 production invariant: explicit CPU-only Ultralytics YOLO OBB.
        device: cpu
        max_detections: 2000
        require_cuda: false
        allow_cpu_fallback: false
        boundary_duplicate_iou: 0.50
        boundary_duplicate_center_px: 16.0

# VQA visual evidence calibration: bindings are stable logical identities;
# the composition root maps them to verified clients, never to raw paths.
# VQA 视觉证据校准：binding 是稳定逻辑身份；组合根把它们映射到已验证客户端，
# 绝不映射到裸路径。
visual_planning:
  gpu_workers:
    enabled: true
    yolo:
      soft_limit_gib: 6
      hard_limit_gib: 8
    segformer:
      soft_limit_gib: 10
      hard_limit_gib: 12
    device_free_floor_gib: 8
    poll_interval_seconds: 1
    max_retries: 1
  detectors:
    detector_obb_csl_001:
      confidence_threshold: 0.20
      nms_iou_threshold: 0.50
      max_detections: 1000
  segmenters:
    segmenter_mitb2_001:
      enabled: true
      class_map_version: verified-2026-08-06
    segmenter_oem_001:
      enabled: true
      class_map_version: verified-2026-08-20
  preprocessing:
    version: yolo-v1-segformer-pad-v1
    tile_size: 1024
    partition_policy: greedy-row-major-no-overlap
    remainder_resize: stretch
    rgb_interpolation: lanczos
    mask_inverse_interpolation: nearest
    max_tile_concurrency: 4

counting:
  sequential: true
  concurrency: 1
  fallback_on_backend_unavailable: true
  fallback_on_backend_error: true
  verify_empty_detection: true
  verify_empty_semantic: false
  trust_empty_detection: false
  multi_detector_enabled: true
  max_selected_detector_experts: 2
  min_successful_detector_experts: 1
  ensemble_iou_threshold: 0.45
  ensemble_center_distance_ratio: 0.60
  ensemble_singleton_high_confidence: 0.65
  max_disagreement_regions: 12
  disagreement_context_padding_ratio: 0.35
  unresolved_ensemble_policy: retain_high_confidence

agents:
  change:
    registration:
      enabled: true
      quality_policy: fallback_raw
    harmonization:
      enabled: true
      reject_when_pif_mad_worse: true
    semantic:
      enabled: true
      feature_stages: [1, 2, 3]
      multi_expert_enabled: true
      max_experts: 2
      min_successful_experts: 1
      semantic_consensus_weight: 0.65
      semantic_union_weight: 0.35
      failure_policy: fallback_legacy
      temporal_stability_enabled: false
    building_rescue:
      enabled: true
      shadow_only: false
      qwen_review_enabled: true
      allowed_directions: [added]
      edge_only: true
    reliability:
      enabled: true
    learned_change:
      enabled: false
      mode: shadow
      checkpoint_dir: null
      fusion_weight: 0.0
      failure_policy: fallback_rule
      strict_contract: true
      device: auto
    training_capture:
      enabled: false
      save_dense_features: false
      capture_learned_inputs_only: true
