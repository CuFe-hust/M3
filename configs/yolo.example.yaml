# Generic YOLO Counting Deployment Example — CUDA-capable schema example.
# This is not the GB10 production profile; use configs/local.yaml for GB10.
# The audited DOTA YOLO11m checkpoint below is a Git LFS asset.
# YOLO 计数部署示例——下列已审计 DOTA YOLO11m checkpoint 由 Git LFS 管理。
agents:
  counting:
    default_backend: auto
backend:
  yolo:
    enabled: true
    detectors:
      - name: detector_obb_csl_001
        enabled: true
        weights: models/yolo_obb/dota_v2_yolo11m_obb_best.pt
        runtime: ultralytics
        task: obb
        model_id: YOLO11m-OBB:DOTA-v2.0:best
        sha256: f9db8b4165421f64f8a380a7f1a365de7c94dff98eb5b9606d0e93969ae8eb21
        source_dataset: DOTAv2.0
        priority: 100
        classes: [plane, ship, storage-tank, baseball-diamond, tennis-court, basketball-court, ground-track-field, harbor, bridge, large-vehicle, small-vehicle, helicopter, roundabout, soccer-ball-field, swimming-pool, container-crane, airport, helipad]
        aliases: {storage tank: storage-tank, baseball diamond: baseball-diamond, tennis court: tennis-court, basketball court: basketball-court, ground track field: ground-track-field, large vehicle: large-vehicle, small vehicle: small-vehicle, soccer ball field: soccer-ball-field, swimming pool: swimming-pool, container crane: container-crane}
        confidence: 0.20
        iou: 0.50
        image_size: 1024
        device: "0"
        max_detections: 1000
        require_cuda: true
        allow_cpu_fallback: false
        boundary_duplicate_iou: 0.50
        boundary_duplicate_center_px: 16.0

counting:
  fallback_on_backend_unavailable: true
  fallback_on_backend_error: true
  verify_empty_detection: true
  verify_empty_semantic: false
  trust_empty_detection: false
