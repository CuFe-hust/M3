# Change V3 partial configuration example.
# This file overlays built-in AppSettings defaults when passed directly through
# --config. It does not inherit configs/local.yaml.
# Registration is conservative global geometry only; raw T1/T2 remain untouched.
agents:
  change:
    registration:
      enabled: true
      quality_policy: fallback_raw
    harmonization:
      enabled: true
    semantic:
      enabled: true
      feature_stages: [1, 2, 3]
      multi_expert_enabled: true
      max_experts: 2
      min_successful_experts: 1
      semantic_consensus_weight: 0.65
      semantic_union_weight: 0.35
    learned_change:
      enabled: false
      mode: shadow
      checkpoint_dir: null
      fusion_weight: 0.0
      failure_policy: fallback_rule
      strict_contract: true
      device: auto
    training_capture:
      enabled: false
      save_dense_features: false
      capture_learned_inputs_only: true
counting:
  multi_detector_enabled: true
  max_selected_detector_experts: 2
  min_successful_detector_experts: 1
  ensemble_iou_threshold: 0.45
  ensemble_center_distance_ratio: 0.60
  ensemble_singleton_high_confidence: 0.65
  max_disagreement_regions: 12
  disagreement_context_padding_ratio: 0.35
  unresolved_ensemble_policy: retain_high_confidence
