# Spark deployment profile: same runtime policy as configs/local.yaml,
# with the Spark Qwen 9B checkpoint and one OBB YOLO expert.
models:
  qwen:
    model: /home/user/models/Qwen3.5-9B
    cache_model_id: qwen3.5-9b-spark
    dtype: bfloat16
    device_map: auto
    allow_download: false

reporting:
  native_html: true
  max_visual_samples: null

agents:
  counting:
    default_backend: yolo_obb
  change:
    registration:
      enabled: true
      quality_policy: fallback_raw
    harmonization:
      enabled: true
      reject_when_pif_mad_worse: true
    semantic:
      enabled: true
      feature_stages: [1, 2, 3]
      multi_expert_enabled: true
      max_experts: 2
      min_successful_experts: 1
      semantic_consensus_weight: 0.65
      semantic_union_weight: 0.35
      failure_policy: fallback_legacy
      temporal_stability_enabled: false
    building_rescue:
      enabled: true
      shadow_only: false
      qwen_review_enabled: true
      allowed_directions: [added]
      edge_only: true
    reliability:
      enabled: true
    learned_change:
      enabled: false
      mode: shadow
      checkpoint_dir: null
      fusion_weight: 0.0
      failure_policy: fallback_rule
      strict_contract: true
      device: auto
    training_capture:
      enabled: false
      save_dense_features: false
      capture_learned_inputs_only: true

backend:
  yolo:
    enabled: true
    detectors:
      - name: detector_obb_csl_001
        enabled: true
        weights: models/yolo_obb/dota_v2_yolo11m_obb_best.pt
        runtime: ultralytics
        task: obb
        model_id: YOLO11m-OBB:DOTA-v2.0:best
        sha256: f9db8b4165421f64f8a380a7f1a365de7c94dff98eb5b9606d0e93969ae8eb21
        source_dataset: DOTAv2.0
        priority: 100
        classes: [plane, ship, storage-tank, baseball-diamond, tennis-court, basketball-court, ground-track-field, harbor, bridge, large-vehicle, small-vehicle, helicopter, roundabout, soccer-ball-field, swimming-pool, container-crane, airport, helipad]
        aliases: {storage tank: storage-tank, baseball diamond: baseball-diamond, tennis court: tennis-court, basketball court: basketball-court, ground track field: ground-track-field, large vehicle: large-vehicle, small vehicle: small-vehicle, soccer ball field: soccer-ball-field, swimming pool: swimming-pool, container crane: container-crane}
        confidence: 0.20
        iou: 0.50
        image_size: 1024
        device: cpu
        max_detections: 1000
        require_cuda: false
        allow_cpu_fallback: false
        boundary_duplicate_iou: 0.50
        boundary_duplicate_center_px: 16.0

visual_planning:
  detectors:
    detector_obb_csl_001:
      confidence_threshold: 0.20
      nms_iou_threshold: 0.50
      max_detections: 1000
  segmenters:
    segmenter_mitb2_001:
      enabled: true
      class_map_version: verified-2026-08-06
    segmenter_oem_001:
      enabled: true
      class_map_version: verified-2026-08-20
  preprocessing:
    version: greedy-1024-stretch-v1
    tile_size: 1024
    partition_policy: greedy-row-major-no-overlap
    remainder_resize: stretch
    rgb_interpolation: lanczos
    mask_inverse_interpolation: nearest
    max_tile_concurrency: 4

counting:
  sequential: true
  concurrency: 1
  fallback_on_backend_unavailable: true
  fallback_on_backend_error: true
  verify_empty_detection: true
  verify_empty_semantic: false
  trust_empty_detection: false
  multi_detector_enabled: true
  max_selected_detector_experts: 1
  min_successful_detector_experts: 1
  ensemble_iou_threshold: 0.45
  ensemble_center_distance_ratio: 0.60
  ensemble_singleton_high_confidence: 0.65
  max_disagreement_regions: 12
  disagreement_context_padding_ratio: 0.35
  unresolved_ensemble_policy: retain_high_confidence
